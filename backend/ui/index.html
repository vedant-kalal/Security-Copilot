<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>security-copilot</title>
  <script>
    /* Apply the saved theme before first paint so there's no flash. */
    (function () {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('sc-theme') || 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* ── Design tokens — DARK (default) ──────────────────────────────── */
    :root,
    :root[data-theme="dark"] {
      --bg: #111827;
      --panel: #1A2235;
      --panel-raised: #212B42;
      --border: #2D3A52;
      --text: #E2E8F0;
      --muted: #94A3B8;
      --accent: #818CF8;
      --accent-deep: #6366f1;
      --accent-glow: rgba(129, 140, 248, 0.30);
      --sentinel: #2DD4BF;
      --sentinel-glow: rgba(45, 212, 191, 0.25);

      --dangerous: #FB7185;
      --dangerous-bg: rgba(251, 113, 133, 0.10);
      --dangerous-glow: rgba(251, 113, 133, 0.22);
      --dangerous-bar: rgba(251, 113, 133, 0.35);
      --suspicious: #FBBF24;
      --suspicious-bg: rgba(251, 191, 36, 0.10);
      --suspicious-glow: rgba(251, 191, 36, 0.22);
      --suspicious-bar: rgba(251, 191, 36, 0.35);
      --safe: #34D399;
      --safe-bg: rgba(52, 211, 153, 0.10);
      --safe-glow: rgba(52, 211, 153, 0.22);
      --safe-bar: rgba(52, 211, 153, 0.35);
      --inconclusive: #94A3B8;
      --inconclusive-bg: rgba(148, 163, 184, 0.08);
      --inconclusive-glow: rgba(148, 163, 184, 0.15);

      --hover-bg: rgba(33, 43, 66, 0.6);
      --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.15), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      --card-shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.22), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      --tool-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      --tool-shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.2);
      --input-bg: var(--bg);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: 0.2s ease;
    }

    /* ── Design tokens — LIGHT (cool cream) ──────────────────────────── */
    :root[data-theme="light"] {
      --bg: #E9EAE2;
      --panel: #F3F4EE;
      --panel-raised: #FBFCF7;
      --border: #D3D6CB;
      --text: #222A35;
      --muted: #5E6875;
      --accent: #5850EC;
      --accent-deep: #4F46E5;
      --accent-glow: rgba(88, 80, 236, 0.16);
      --sentinel: #0E9384;
      --sentinel-glow: rgba(14, 147, 132, 0.16);

      --dangerous: #E11D48;
      --dangerous-bg: rgba(225, 29, 72, 0.08);
      --dangerous-glow: rgba(225, 29, 72, 0.14);
      --dangerous-bar: rgba(225, 29, 72, 0.30);
      --suspicious: #C2620A;
      --suspicious-bg: rgba(194, 98, 10, 0.09);
      --suspicious-glow: rgba(194, 98, 10, 0.14);
      --suspicious-bar: rgba(194, 98, 10, 0.30);
      --safe: #059669;
      --safe-bg: rgba(5, 150, 105, 0.09);
      --safe-glow: rgba(5, 150, 105, 0.14);
      --safe-bar: rgba(5, 150, 105, 0.30);
      --inconclusive: #64748B;
      --inconclusive-bg: rgba(100, 116, 139, 0.08);
      --inconclusive-glow: rgba(100, 116, 139, 0.12);

      --hover-bg: rgba(30, 40, 55, 0.05);
      --card-shadow: 0 2px 16px rgba(60, 70, 90, 0.08), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
      --card-shadow-hover: 0 6px 24px rgba(60, 70, 90, 0.13), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
      --tool-shadow: 0 2px 10px rgba(60, 70, 90, 0.06);
      --tool-shadow-hover: 0 4px 18px rgba(60, 70, 90, 0.11);
      --input-bg: #FDFEFA;
    }

    /* ── Reset & base ────────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: 'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Custom scrollbar ────────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ── App layout ──────────────────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      width: 380px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 20px 18px;
      border-bottom: 1px solid transparent;
      background-image: linear-gradient(var(--panel), var(--panel)),
        linear-gradient(135deg, var(--sentinel), var(--accent));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      border-bottom: 1px solid;
      border-image: linear-gradient(135deg, var(--sentinel), var(--accent)) 1;
    }

    .sidebar-header .shield-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.15), rgba(129, 140, 248, 0.15));
      border-radius: var(--radius-sm);
      border: 1px solid rgba(45, 212, 191, 0.2);
    }

    .sidebar-header .shield-icon svg {
      width: 18px;
      height: 18px;
      color: var(--sentinel);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .theme-toggle {
      margin-left: auto;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }

    .theme-toggle:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle .icon-sun {
      display: none;
    }

    :root[data-theme="light"] .theme-toggle .icon-sun {
      display: block;
    }

    :root[data-theme="light"] .theme-toggle .icon-moon {
      display: none;
    }

    /* ── Mode tabs (Phishing / Anomaly) ──────────────────────────────── */
    .mode-tabs {
      display: flex;
      gap: 6px;
      padding: 14px 20px 0;
    }

    .mode-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.02em;
    }

    .mode-tab svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mode-tab:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .mode-tab.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-glow);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .mode-tab.active.anomaly {
      color: var(--sentinel);
      border-color: var(--sentinel);
      background: var(--sentinel-glow);
      box-shadow: 0 0 12px var(--sentinel-glow);
    }

    .mode-hint {
      padding: 12px 20px 4px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mode-hint .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sentinel);
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--sentinel-glow);
      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* ── URL input form ──────────────────────────────────────────────── */
    #submit-form {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    #url-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }

    #url-input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    #url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #submit-form button {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      letter-spacing: 0.02em;
    }

    #submit-form button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    #submit-form button:active {
      transform: translateY(0);
    }

    #submit-form button:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    /* ── Status line ─────────────────────────────────────────────────── */
    #status-line {
      padding: 10px 20px;
      font-size: 12px;
      color: var(--muted);
      min-height: 20px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.02em;
    }

    #status-line:not(:empty) {
      background: linear-gradient(90deg,
          rgba(129, 140, 248, 0.06) 0%, rgba(45, 212, 191, 0.08) 50%, rgba(129, 140, 248, 0.06) 100%);
      background-size: 200% 100%;
      animation: scanning 2s ease-in-out infinite;
    }

    @keyframes scanning {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    /* ── History list ────────────────────────────────────────────────── */
    #history-list {
      overflow-y: auto;
      flex: 1;
    }

    .run-item {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      border-left: 3px solid transparent;
    }

    .run-item:hover {
      background: var(--hover-bg);
    }

    .run-item.active {
      background: var(--panel-raised);
      border-left-color: var(--accent);
    }

    .run-item .input {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .run-item .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .run-item .time {
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── Verdict badges ──────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: box-shadow var(--transition);
    }

    .badge.dangerous {
      background: var(--dangerous-bg);
      color: var(--dangerous);
      box-shadow: 0 0 12px var(--dangerous-glow);
    }

    .badge.suspicious {
      background: var(--suspicious-bg);
      color: var(--suspicious);
      box-shadow: 0 0 12px var(--suspicious-glow);
    }

    .badge.safe {
      background: var(--safe-bg);
      color: var(--safe);
      box-shadow: 0 0 12px var(--safe-glow);
    }

    .badge.inconclusive {
      background: var(--inconclusive-bg);
      color: var(--inconclusive);
      box-shadow: 0 0 8px var(--inconclusive-glow);
    }

    /* ── Main content area ───────────────────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      background: var(--bg);
    }

    main>* {
      max-width: 820px;
    }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 80px 20px;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ── Verdict card ────────────────────────────────────────────────── */
    .verdict-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 28px;
      background: var(--panel);
      box-shadow: var(--card-shadow);
      transition: box-shadow var(--transition);
    }

    .verdict-card:hover {
      box-shadow: var(--card-shadow-hover);
    }

    .verdict-card h2 {
      margin: 0 0 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .verdict-card .label-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .verdict-card .label-row .badge {
      font-size: 13px;
      padding: 5px 16px;
    }

    .verdict-card .confidence {
      color: var(--muted);
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .verdict-card .reason {
      line-height: 1.7;
      font-size: 14px;
    }

    .verdict-card .mitigation {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .verdict-card .alternatives {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .verdict-card .alternatives .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .verdict-card .alternatives a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--sentinel);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 4px;
      margin-right: 16px;
      transition: color var(--transition);
    }

    .verdict-card .alternatives a:hover {
      color: #5EEAD4;
      text-decoration: underline;
    }

    /* ── Confidence gauge (animated SVG ring) ────────────────────────── */
    .confidence-gauge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .confidence-gauge svg {
      width: 52px;
      height: 52px;
      transform: rotate(-90deg);
    }

    .confidence-gauge .gauge-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 5;
    }

    .confidence-gauge .gauge-fill {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease-out;
    }

    .confidence-gauge .gauge-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .confidence-gauge .gauge-sublabel {
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 2px;
    }

    /* ── Visual bar (for phishing score, VT stats) ───────────────────── */
    .visual-bar-container {
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .visual-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .visual-bar-track {
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
      position: relative;
    }

    .visual-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s ease-out;
      position: relative;
    }

    .visual-bar-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -1px;
      width: 2px;
      height: 8px;
      background: inherit;
      border-radius: 1px;
      filter: brightness(1.3);
    }

    .visual-bar-fill.bar-safe {
      background: var(--safe);
      box-shadow: 0 0 8px var(--safe-glow);
    }

    .visual-bar-fill.bar-suspicious {
      background: var(--suspicious);
      box-shadow: 0 0 8px var(--suspicious-glow);
    }

    .visual-bar-fill.bar-dangerous {
      background: var(--dangerous);
      box-shadow: 0 0 8px var(--dangerous-glow);
    }

    .visual-bar-fill.bar-accent {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .visual-bar-fill.bar-muted {
      background: var(--muted);
    }

    /* ── VT stats visual grid ────────────────────────────────────────── */
    .vt-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .vt-stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .vt-stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .vt-stat-card .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .vt-stat-card .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 6px;
      font-weight: 500;
    }

    .vt-stat-card.stat-malicious .stat-value {
      color: var(--dangerous);
    }

    .vt-stat-card.stat-suspicious .stat-value {
      color: var(--suspicious);
    }

    .vt-stat-card.stat-harmless .stat-value {
      color: var(--safe);
    }

    /* ── Redirect chain visual timeline ──────────────────────────────── */
    .redirect-timeline {
      margin: 10px 0;
      padding-left: 4px;
    }

    .redirect-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      padding-bottom: 16px;
      animation: fadeSlideIn 0.3s ease-out both;
    }

    .redirect-step:nth-child(1) {
      animation-delay: 0.1s;
    }

    .redirect-step:nth-child(2) {
      animation-delay: 0.2s;
    }

    .redirect-step:nth-child(3) {
      animation-delay: 0.3s;
    }

    .redirect-step:nth-child(4) {
      animation-delay: 0.4s;
    }

    .redirect-step:nth-child(5) {
      animation-delay: 0.5s;
    }

    .redirect-step:last-child {
      padding-bottom: 0;
    }

    .redirect-step::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 18px;
      width: 2px;
      bottom: 0;
      background: linear-gradient(to bottom, var(--accent), transparent);
    }

    .redirect-step:last-child::before {
      display: none;
    }

    .redirect-dot {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--panel-raised);
      border: 2px solid var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      margin-top: 2px;
    }

    .redirect-step:last-child .redirect-dot {
      border-color: var(--sentinel);
      box-shadow: 0 0 8px var(--sentinel-glow);
    }

    .redirect-detail {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
    }

    .redirect-detail .hop-status {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      background: var(--accent-glow);
      color: var(--accent);
      margin-left: 6px;
    }

    .redirect-detail .hop-url {
      color: var(--muted);
      word-break: break-all;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ── Tool call cards ─────────────────────────────────────────────── */
    .tool-call {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      margin-bottom: 16px;
      background: var(--panel);
      box-shadow: var(--tool-shadow);
      transition: box-shadow var(--transition), transform var(--transition);
      animation: fadeSlideIn 0.4s ease-out both;
    }

    .tool-call:nth-child(1) {
      animation-delay: 0s;
    }

    .tool-call:nth-child(2) {
      animation-delay: 0.1s;
    }

    .tool-call:nth-child(3) {
      animation-delay: 0.15s;
    }

    .tool-call:nth-child(4) {
      animation-delay: 0.2s;
    }

    .tool-call:hover {
      box-shadow: var(--tool-shadow-hover);
      transform: translateY(-1px);
    }

    .tool-call h3 {
      margin: 0 0 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-call h3 .tool-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      flex-shrink: 0;
    }

    /* ── Fields ──────────────────────────────────────────────────────── */
    .field {
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    .field b {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: 4px;
    }

    .field code {
      background: var(--panel-raised);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border: 1px solid var(--border);
    }

    /* ── Redirect/form/link items ────────────────────────────────────── */
    .redirect-hop {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      margin-left: 16px;
      color: var(--muted);
      padding: 2px 0;
    }

    .form-item,
    .link-item {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      margin-left: 16px;
      color: var(--muted);
      padding: 2px 0;
    }

    .link-item a {
      color: var(--sentinel);
      text-decoration: none;
      transition: color var(--transition);
    }

    .link-item a:hover {
      color: #5EEAD4;
      text-decoration: underline;
    }

    /* ── Page text block ─────────────────────────────────────────────── */
    .page-text {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* ── Screenshot ──────────────────────────────────────────────────── */
    .screenshot {
      max-width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-top: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .screenshot:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* ── Forms & links summary cards ─────────────────────────────────── */
    .summary-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .summary-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 500;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text);
    }

    .summary-chip .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .summary-chip .chip-dot.dot-accent {
      background: var(--accent);
    }

    .summary-chip .chip-dot.dot-safe {
      background: var(--safe);
    }

    .summary-chip .chip-dot.dot-dangerous {
      background: var(--dangerous);
    }

    .summary-chip .chip-dot.dot-muted {
      background: var(--muted);
    }

    /* ── Input display ───────────────────────────────────────────────── */
    .input-display {
      margin-bottom: 24px;
      word-break: break-all;
      font-size: 13px;
    }

    .input-display b {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="shield-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <h1>security-copilot</h1>
        <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        </button>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-phishing" data-mode="phishing">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          Phishing
        </button>
        <button class="mode-tab anomaly" id="tab-anomaly" data-mode="anomaly">
          <svg viewBox="0 0 24 24">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          Anomaly
        </button>
      </div>
      <form id="submit-form">
        <input id="url-input" placeholder="Paste a URL to check..." autocomplete="off" />
        <button type="submit" id="submit-btn">Check</button>
      </form>
      <div class="mode-hint" id="mode-hint"></div>
      <div id="status-line"></div>
      <div id="history-list"></div>
    </aside>
    <main id="detail-pane">
      <p class="empty-state">Select a run from the left, or submit a new URL above.</p>
    </main>
  </div>

  <script>
    const historyList = document.getElementById('history-list');
    const detailPane = document.getElementById('detail-pane');
    const statusLine = document.getElementById('status-line');
    const form = document.getElementById('submit-form');
    const urlInput = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const modeHint = document.getElementById('mode-hint');
    const tabPhishing = document.getElementById('tab-phishing');
    const tabAnomaly = document.getElementById('tab-anomaly');
    const themeToggle = document.getElementById('theme-toggle');

    let activeRunId = null;
    let currentMode = 'phishing';   // 'phishing' | 'anomaly'

    /* ── Theme ─────────────────────────────────────────────────────── */
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('sc-theme', theme);
    }
    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      applyTheme(next);
    });

    /* ── Mode (Phishing / Anomaly) ─────────────────────────────────── */
    function setMode(mode) {
      currentMode = mode;
      tabPhishing.classList.toggle('active', mode === 'phishing');
      tabAnomaly.classList.toggle('active', mode === 'anomaly');

      // The URL box only makes sense for phishing — anomalies arrive from the
      // native network helper, they aren't submitted by hand.
      form.style.display = mode === 'phishing' ? 'flex' : 'none';

      if (mode === 'anomaly') {
        modeHint.innerHTML = `<span class="pulse-dot"></span>Live network anomalies flagged by the backend monitor.`;
      } else {
        modeHint.innerHTML = '';
      }

      detailPane.innerHTML = mode === 'phishing'
        ? '<p class="empty-state">Select a run from the left, or submit a new URL above.</p>'
        : '<p class="empty-state">Select a flagged network flow from the left to see its full investigation.</p>';
      activeRunId = null;
      return loadHistory();
    }
    tabPhishing.addEventListener('click', () => setMode('phishing'));
    tabAnomaly.addEventListener('click', () => setMode('anomaly'));

    function fmtTime(epochSeconds) {
      return new Date(epochSeconds * 1000).toLocaleString();
    }

    function badge(label) {
      return `<span class="badge ${label}">${label}</span>`;
    }

    /* ── Confidence gauge (animated SVG ring) ──────────────────────── */
    function confidenceGauge(value, label) {
      const pct = Math.round((value || 0) * 100);
      const r = 20;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      let color = 'var(--safe)';
      if (label === 'dangerous') color = 'var(--dangerous)';
      else if (label === 'suspicious') color = 'var(--suspicious)';
      else if (label === 'inconclusive') color = 'var(--inconclusive)';

      return `
    <div class="confidence-gauge">
      <svg viewBox="0 0 52 52">
        <circle class="gauge-bg" cx="26" cy="26" r="${r}" />
        <circle class="gauge-fill" cx="26" cy="26" r="${r}"
          stroke="${color}"
          stroke-dasharray="${circ}"
          stroke-dashoffset="${offset}" />
      </svg>
      <div>
        <div class="gauge-label" style="color:${color}">${pct}%</div>
        <div class="gauge-sublabel">confidence</div>
      </div>
    </div>
  `;
    }

    /* ── Visual bar helper ─────────────────────────────────────────── */
    function visualBar(label, value, max, barClass) {
      const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
      const displayValue = max === 100 ? `${value}%` : `${value}${max ? ' / ' + max : ''}`;
      return `
    <div class="visual-bar-container">
      <div class="visual-bar-label"><span>${label}</span><span>${displayValue}</span></div>
      <div class="visual-bar-track">
        <div class="visual-bar-fill ${barClass}" style="width:${pct}%"></div>
      </div>
    </div>
  `;
    }

    async function loadHistory() {
      const res = await fetch(`/runs?view=${currentMode}&limit=100`);
      const runs = await res.json();
      const emptyMsg = currentMode === 'anomaly'
        ? 'No network anomalies flagged yet.'
        : 'No checks yet — paste a URL above.';
      historyList.innerHTML = runs.map(r => `
    <div class="run-item ${r.id === activeRunId ? 'active' : ''}" data-id="${r.id}">
      <div class="input">${escapeHtml(r.raw_input)}</div>
      <div class="meta">
        ${badge(r.verdict.label)}
        <span class="time">${fmtTime(r.created_at)}</span>
      </div>
    </div>
  `).join('') || `<p class="empty-state" style="padding:16px;">${emptyMsg}</p>`;

      historyList.querySelectorAll('.run-item').forEach(el => {
        el.addEventListener('click', () => showRun(el.dataset.id));
      });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function screenshotUrl(path) {
      if (!path) return null;
      // Paths may use either separator (Windows saves them with backslashes); split
      // on both so we always end up with just the filename the /screenshots mount serves.
      const filename = path.split(/[\\/]/).pop();
      return `/screenshots/${filename}`;
    }

    function renderInspectWebsite(a) {
      let html = '';
      html += `<div class="field"><b>Final URL:</b> <code>${escapeHtml(a.final_url)}</code></div>`;
      if (a.status_code != null) html += `<div class="field"><b>Status:</b> ${a.status_code}</div>`;
      if (a.navigation_error) html += `<div class="field"><b>Navigation failed:</b> ${escapeHtml(a.navigation_error)}</div>`;
      if (a.error) html += `<div class="field"><b>Error:</b> ${escapeHtml(a.error)}</div>`;

      /* ── Redirect chain visual timeline ──────────────────────────── */
      const chain = a.redirect_chain || [];
      if (chain.length > 1) {
        html += `<div class="field"><b>Redirect chain (${chain.length} hops):</b></div>`;
        html += `<div class="redirect-timeline">`;
        chain.forEach((hop, i) => {
          html += `
        <div class="redirect-step">
          <div class="redirect-dot"></div>
          <div class="redirect-detail">
            <span class="hop-url">${escapeHtml(hop.url)}</span>
            <span class="hop-status">${hop.status}</span>
          </div>
        </div>
      `;
        });
        html += `</div>`;
      }

      /* ── Summary chips (forms + links at a glance) ───────────────── */
      const forms = a.forms || [];
      const links = a.links || [];
      const hasPassword = forms.some(f => f.has_password_field);
      html += `<div class="summary-chips">`;
      html += `<span class="summary-chip"><span class="chip-dot ${forms.length ? 'dot-accent' : 'dot-muted'}"></span>${forms.length} form${forms.length !== 1 ? 's' : ''}</span>`;
      if (hasPassword) html += `<span class="summary-chip"><span class="chip-dot dot-dangerous"></span>password field</span>`;
      html += `<span class="summary-chip"><span class="chip-dot ${links.length ? 'dot-accent' : 'dot-muted'}"></span>${links.length} link${links.length !== 1 ? 's' : ''}</span>`;
      html += `<span class="summary-chip"><span class="chip-dot dot-muted"></span>${(a.network_requests || []).length} requests</span>`;
      html += `</div>`;

      forms.forEach(f => {
        html += `<div class="form-item">submits to ${escapeHtml(f.action)} (${f.has_password_field ? 'has a password field' : 'no password field'})</div>`;
      });

      if (links.length) {
        links.slice(0, 10).forEach(l => {
          html += `<div class="link-item">${l.same_origin ? '(same-origin)' : '(cross-origin)'} ${escapeHtml(l.href)}</div>`;
        });
        if (links.length > 10) html += `<div class="link-item">... and ${links.length - 10} more</div>`;
      }

      if (a.page_text) {
        html += `<div class="field" style="margin-top:8px;"><b>Page text (excerpt):</b></div><div class="page-text">${escapeHtml(a.page_text.slice(0, 1500))}</div>`;
      }

      return html;
    }

    function renderDomainReputation(a) {
      let html = `<div class="field"><b>Domain:</b> <code>${escapeHtml(a.domain)}</code></div>`;
      const whois = a.whois || {};
      html += `<div class="field"><b>WHOIS:</b> ${escapeHtml(whois.detail)}</div>`;
      const vt = a.virustotal || {};
      if (vt.available) {
        /* ── VirusTotal visual stat cards ────────────────────────────── */
        const total = (vt.malicious_count || 0) + (vt.suspicious_count || 0) + (vt.harmless_count || 0);
        html += `
      <div class="vt-stats">
        <div class="vt-stat-card stat-malicious">
          <div class="stat-value">${vt.malicious_count || 0}</div>
          <div class="stat-label">Malicious</div>
        </div>
        <div class="vt-stat-card stat-suspicious">
          <div class="stat-value">${vt.suspicious_count || 0}</div>
          <div class="stat-label">Suspicious</div>
        </div>
        <div class="vt-stat-card stat-harmless">
          <div class="stat-value">${vt.harmless_count || 0}</div>
          <div class="stat-label">Harmless</div>
        </div>
      </div>
    `;
        /* ── Stacked proportional bar ────────────────────────────────── */
        if (total > 0) {
          const mPct = Math.round((vt.malicious_count / total) * 100);
          const sPct = Math.round((vt.suspicious_count / total) * 100);
          const hPct = 100 - mPct - sPct;
          html += `
        <div class="visual-bar-container">
          <div class="visual-bar-label"><span>Detection ratio</span><span>${total} engines</span></div>
          <div class="visual-bar-track" style="display:flex; overflow:hidden;">
            <div style="width:${mPct}%; height:100%; background:var(--dangerous); transition:width 1s ease-out;"></div>
            <div style="width:${sPct}%; height:100%; background:var(--suspicious); transition:width 1s ease-out;"></div>
            <div style="width:${hPct}%; height:100%; background:var(--safe); transition:width 1s ease-out;"></div>
          </div>
        </div>
      `;
        }
        html += `<div class="field"><b>Reputation score:</b> ${vt.reputation_score}</div>`;
        if (vt.community_reputation !== null && vt.community_reputation !== undefined) {
          html += `<div class="field"><b>VT community reputation:</b> ${vt.community_reputation}</div>`;
        }

        /* ── Per-vendor detections: WHAT each engine actually flagged, not ── */
        /* just how many did (VT aggregates ~70-90 independent AV/URL-rep engines). */
        const flaggedBy = vt.flagged_by || [];
        if (flaggedBy.length) {
          html += `<div class="field" style="margin-top:10px;"><b>Flagged by (what each vendor found):</b></div>`;
          flaggedBy.forEach(f => {
            const badgeClass = f.category === 'malicious' ? 'dangerous' : 'suspicious';
            html += `<div class="link-item">${badge(badgeClass)} <b>${escapeHtml(f.vendor)}</b> &mdash; ${escapeHtml(f.result || f.category || '')}</div>`;
          });
        }

        /* ── Threat categorization: dedicated web-categorization vendors' own ── */
        /* label for the domain (phishing, spam, etc.) — separate from the AV engines above. */
        const categories = vt.categories || {};
        const categoryEntries = Object.entries(categories);
        if (categoryEntries.length) {
          html += `<div class="field" style="margin-top:10px;"><b>Threat categorization:</b></div>`;
          categoryEntries.forEach(([vendor, label]) => {
            html += `<div class="link-item">${escapeHtml(vendor)}: <b>${escapeHtml(label)}</b></div>`;
          });
        }
      } else {
        html += `<div class="field"><b>VirusTotal:</b> unavailable (${escapeHtml(vt.detail)})</div>`;
      }
      return html;
    }

    function renderContentClassifier(a) {
      if (a.error) return `<div class="field"><b>Error:</b> ${escapeHtml(a.error)}</div>`;
      /* ── Phishing score visual bar ──────────────────────────────── */
      const score = a.phishing_score || 0;
      let barClass = 'bar-safe';
      if (score > 0.7) barClass = 'bar-dangerous';
      else if (score > 0.4) barClass = 'bar-suspicious';

      return `
    <div class="field"><b>Model:</b> ${escapeHtml(a.model)}</div>
    <div class="field"><b>Input type:</b> ${escapeHtml(a.input_type)}</div>
    ${visualBar('Phishing probability', Math.round(score * 100), 100, barClass)}
    <div class="field"><b>Label:</b> <span class="badge ${a.label === 'phishing' ? 'dangerous' : 'safe'}" style="font-size:10px; padding:2px 8px;">${escapeHtml(a.label)}</span></div>
  `;
    }

    function renderWebSearch(a) {
      if (!a.available) return `<div class="field"><b>Search unavailable:</b> ${escapeHtml(a.detail)}</div>`;
      let html = `<div class="field"><b>Query:</b> ${escapeHtml(a.query)}</div>`;
      (a.results || []).forEach(r => {
        html += `<div class="link-item"><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a></div>`;
      });
      return html;
    }

    const RENDERERS = {
      inspect_website: renderInspectWebsite,
      domain_reputation: renderDomainReputation,
      content_classifier: renderContentClassifier,
      web_search: renderWebSearch,
    };

    async function showRun(runId) {
      activeRunId = runId;
      document.querySelectorAll('.run-item').forEach(el => el.classList.toggle('active', el.dataset.id === runId));

      const res = await fetch(`/runs/${runId}`);
      if (!res.ok) { detailPane.innerHTML = '<p class="empty-state">Run not found.</p>'; return; }
      const run = await res.json();
      const v = run.verdict || {};
      const alternatives = v.legitimate_alternatives || [];

      let html = `
    <div class="verdict-card">
      <h2>${escapeHtml(run.case_type)} &middot; ${fmtTime(run.created_at)}</h2>
      <div class="label-row">${badge(v.label || 'inconclusive')} ${confidenceGauge(v.confidence, v.label)}</div>
      <div class="reason">${escapeHtml(v.reason)}</div>
      ${v.mitigation ? `<div class="mitigation">${escapeHtml(v.mitigation)}</div>` : ''}
      ${alternatives.length ? `
        <div class="alternatives">
          <div class="label">This might be an impersonation of:</div>
          ${alternatives.map(a => `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a>`).join('')}
        </div>
      ` : ''}
      ${(run.raw_input && (run.raw_input.startsWith('http://') || run.raw_input.startsWith('https://'))) ? `
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
          <span style="font-size: 13px; color: #94A3B8;">Help protect others by reporting this phishing site:</span>
          <a style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 8px 14px; background: #6366F1; color: white; border-radius: 8px; font-weight: 600; font-size: 12px;" 
             href="https://safebrowsing.google.com/safebrowsing/report_phish/?url=${encodeURIComponent(run.raw_input)}" 
             target="_blank" rel="noopener"
             title="Report to Google Safe Browsing">
            🚩 Report to Google Safe Browsing ↗
          </a>
        </div>
      ` : ''}
    </div>
    <div class="input-display"><b>Input:</b> ${escapeHtml(run.raw_input)}</div>
  `;

      const calls = run.tool_calls || [];
      if (!calls.length) {
        html += '<p class="empty-state" style="padding:24px 0;">Resolved by the router\'s fast path (blocklist/cache) &mdash; no tools were called.</p>';
      } else {
        calls.forEach((call, i) => {
          const argsStr = Object.entries(call.args || {}).map(([k, v2]) => `${k}=${JSON.stringify(v2)}`).join(', ');
          const renderer = RENDERERS[call.tool];
          html += `<div class="tool-call"><h3><span class="tool-dot"></span>${i + 1}. ${escapeHtml(call.tool)}(${escapeHtml(argsStr)})</h3>`;
          html += renderer ? renderer(call.artifact || {}) : `<div class="field">${escapeHtml(JSON.stringify(call.artifact))}</div>`;
          const shotUrl = screenshotUrl(call.screenshot_path);
          if (shotUrl) html += `<img class="screenshot" src="${shotUrl}" alt="screenshot" />`;
          html += `</div>`;
        });
      }

      detailPane.innerHTML = html;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      submitBtn.disabled = true;
      statusLine.textContent = `Investigating ${url} — this can take 10-30s...`;

      try {
        const res = await fetch('/check-links', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ urls: [url] }),
        });
        const data = await res.json();
        const result = data.results[url];
        statusLine.textContent = result ? `Done: ${result.label}` : 'Done.';
        urlInput.value = '';
        await loadHistory();
        if (result && result.run_id) showRun(result.run_id);
      } catch (err) {
        statusLine.textContent = `Error: ${err}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    async function init() {
      const initialRunId = new URLSearchParams(location.search).get('run');

      // If deep-linked to a specific run, open the matching mode so the sidebar
      // list agrees with the detail being shown.
      if (initialRunId) {
        try {
          const res = await fetch(`/runs/${initialRunId}`);
          if (res.ok) {
            const run = await res.json();
            currentMode = run.case_type === 'network_flow' ? 'anomaly' : 'phishing';
          }
        } catch (_) { /* fall back to default mode */ }
      }

      await setMode(currentMode);
      if (initialRunId) showRun(initialRunId);
    }
    init();
  </script>
</body>

</html>
